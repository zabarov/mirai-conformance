name: conformance

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mirai_ref:
        description: Mirai Git ref containing the shared corpus
        required: false
        default: codex/mirai-2.0

permissions:
  contents: read

jobs:
  python-checker:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zabarov/mirai
          ref: ${{ inputs.mirai_ref || 'codex/mirai-2.0' }}
          path: _upstream/mirai
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
        env:
          MIRAI_REPO: ${{ github.workspace }}/_upstream/mirai
      - run: >-
          mirai-conformance corpus
          _upstream/mirai/conformance/corpus/pure/corpus.json
          --program-schema _upstream/mirai/schemas/mirai-program.schema.json
