[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mirai-conformance"
version = "0.3.0a1"
description = "Independent Python conformance checker for Mirai Program, runtime evidence and graph-native contracts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Rim Zabarov", email = "rim@zabarov.com" }
]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing"
]

[project.scripts]
mirai-conformance = "mirai_conformance.cli:main"

[tool.setuptools.packages.find]
include = ["mirai_conformance*"]
