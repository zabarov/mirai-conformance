name: Conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIRAI_REFERENCE_REPOSITORY: zabarov/mirai-graph
  MIRAI_REFERENCE_REVISION: 432aae41caac4a795a8d15ce523e3b6a03becca5

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout checker
        uses: actions/checkout@v4

      - name: Checkout exact Mirai reference
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MIRAI_REFERENCE_REPOSITORY }}
          ref: ${{ env.MIRAI_REFERENCE_REVISION }}
          path: mirai-reference

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install checker
        run: python -m pip install .

      - name: Run independent tests
        env:
          MIRAI_REPO: ${{ github.workspace }}/mirai-reference
          MIRAI_ORGANIZATION_BUNDLE: ${{ github.workspace }}/mirai-reference/conformance/corpus/organization-2.3/bundle.json
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Run shared corpus from CLI
        run: >-
          mirai-conformance corpus
          mirai-reference/conformance/corpus/pure/corpus.json
          --program-schema mirai-reference/schemas/mirai-program.schema.json
          --output conformance-result.json

      - name: Check source snapshot independently
        run: >-
          mirai-conformance autonomic source-snapshot
          mirai-reference/examples/mirai-autonomic-fabric-minimal/results/source-snapshot.json
          --schema mirai-reference/schemas/source-snapshot.schema.json
          --output autonomic-source-snapshot.json

      - name: Check knowledge proposal independently
        run: >-
          mirai-conformance autonomic knowledge-proposal
          mirai-reference/examples/mirai-autonomic-fabric-minimal/results/knowledge-proposal.json
          --schema mirai-reference/schemas/knowledge-proposal.schema.json
          --output autonomic-knowledge-proposal.json

      - name: Check autonomy envelope independently
        run: >-
          mirai-conformance autonomic autonomy-envelope
          mirai-reference/examples/mirai-autonomic-fabric-minimal/results/autonomy-envelope.json
          --schema mirai-reference/schemas/autonomy-envelope.schema.json
          --output autonomic-autonomy-envelope.json

      - name: Check evolution decision independently
        run: >-
          mirai-conformance autonomic evolution-decision
          mirai-reference/examples/mirai-autonomic-fabric-minimal/results/evolution-decision.json
          --schema mirai-reference/schemas/evolution-decision.schema.json
          --proposal mirai-reference/examples/mirai-autonomic-fabric-minimal/results/evolution-proposal.json
          --envelope mirai-reference/examples/mirai-autonomic-fabric-minimal/results/autonomy-envelope.json
          --output autonomic-evolution-decision.json

      - name: Check bounded cycle independently
        run: >-
          mirai-conformance autonomic autonomic-cycle
          mirai-reference/examples/mirai-autonomic-fabric-minimal/results/autonomic-cycle.json
          --schema mirai-reference/schemas/autonomic-cycle.schema.json
          --output autonomic-autonomic-cycle.json

      - name: Upload conformance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-result-${{ matrix.os }}
          path: |
            conformance-result.json
            autonomic-*.json

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checker
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
