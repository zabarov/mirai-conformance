[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mirai-conformance"
version = "0.6.0a1"
description = "Independent Python conformance checker for Mirai Program, runtime evidence, graph-native, retrieval and outcome contracts."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Rim Zabarov", email = "rim@zabarov.com" }
]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing"
]

[project.urls]
Homepage = "https://github.com/zabarov/mirai-conformance"
Repository = "https://github.com/zabarov/mirai-conformance"
Issues = "https://github.com/zabarov/mirai-conformance/issues"

[project.scripts]
mirai-conformance = "mirai_conformance.cli:main"

[tool.setuptools.packages.find]
include = ["mirai_conformance*"]
