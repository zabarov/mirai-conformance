name: Conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIRAI_REFERENCE_REPOSITORY: zabarov/mirai-graph
  MIRAI_REFERENCE_REVISION: bd1ee2649f6d083590ff61aea7818f76149d9acb

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout checker
        uses: actions/checkout@v4

      - name: Checkout exact Mirai reference
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MIRAI_REFERENCE_REPOSITORY }}
          ref: ${{ env.MIRAI_REFERENCE_REVISION }}
          path: mirai-reference

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install checker
        run: python -m pip install .

      - name: Run independent tests
        env:
          MIRAI_REPO: ${{ github.workspace }}/mirai-reference
          MIRAI_ORGANIZATION_BUNDLE: ${{ github.workspace }}/mirai-reference/conformance/corpus/organization-2.3/bundle.json
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Run shared corpus from CLI
        run: >-
          mirai-conformance corpus
          mirai-reference/conformance/corpus/pure/corpus.json
          --program-schema mirai-reference/schemas/mirai-program.schema.json
          --output conformance-result.json

      - name: Check source snapshot independently
        run: >-
          mirai-conformance autonomic source-snapshot
          mirai-reference/examples/mirai-autonomic-fabric-minimal/results/source-snapshot.json
          --schema mirai-reference/schemas/source-snapshot.schema.json
          --output autonomic-source-snapshot.json

      - name: Check knowledge proposal independently
        run: >-
          mirai-conformance autonomic knowledge-proposal
          mirai-reference/examples/mirai-autonomic-fabric-minimal/results/knowledge-proposal.json
          --schema mirai-reference/schemas/knowledge-proposal.schema.json
          --output autonomic-knowledge-proposal.json

      - name: Check autonomy envelope independently
        run: >-
          mirai-conformance autonomic autonomy-envelope
          mirai-reference/examples/mirai-autonomic-fabric-minimal/results/autonomy-envelope.json
          --schema mirai-reference/schemas/autonomy-envelope.schema.json
          --output autonomic-autonomy-envelope.json

      - name: Check evolution decision independently
        run: >-
          mirai-conformance autonomic evolution-decision
          mirai-reference/examples/mirai-autonomic-fabric-minimal/results/evolution-decision.json
          --schema mirai-reference/schemas/evolution-decision.schema.json
          --proposal mirai-reference/examples/mirai-autonomic-fabric-minimal/results/evolution-proposal.json
          --envelope mirai-reference/examples/mirai-autonomic-fabric-minimal/results/autonomy-envelope.json
          --output autonomic-evolution-decision.json

      - name: Check bounded cycle independently
        run: >-
          mirai-conformance autonomic autonomic-cycle
          mirai-reference/examples/mirai-autonomic-fabric-minimal/results/autonomic-cycle.json
          --schema mirai-reference/schemas/autonomic-cycle.schema.json
          --output autonomic-autonomic-cycle.json

      - name: Check retrieval evidence independently
        run: >-
          mirai-conformance retrieval evidence-bundle
          mirai-reference/examples/mirai-retrieval-minimal/results/evidence-bundle.json
          --schema mirai-reference/schemas/retrieval-evidence-bundle.schema.json
          --output retrieval-evidence.json

      - name: Check retrieval answer independently
        run: >-
          mirai-conformance retrieval answer
          mirai-reference/examples/mirai-retrieval-minimal/results/answer.json
          --schema mirai-reference/schemas/retrieval-answer.schema.json
          --evidence mirai-reference/examples/mirai-retrieval-minimal/results/evidence-bundle.json
          --output retrieval-answer.json

      - name: Check retrieval evaluation independently
        run: >-
          mirai-conformance retrieval evaluation
          mirai-reference/examples/mirai-retrieval-minimal/results/evaluation.json
          --schema mirai-reference/schemas/retrieval-evaluation.schema.json
          --output retrieval-evaluation.json

      - name: Check Outcome Completion assessment independently
        run: >-
          mirai-conformance outcome assessment
          mirai-reference/examples/mirai-outcome-completion-minimal/assessment.json
          --schema mirai-reference/schemas/outcome-assessment.schema.json
          --contract mirai-reference/examples/mirai-outcome-completion-minimal/outcome-contract.json
          --candidates mirai-reference/examples/mirai-outcome-completion-minimal/candidate-set.json
          --evidence mirai-reference/examples/mirai-outcome-completion-minimal/evidence-set.json
          --admission-policy-digest sha256:17ad92e63c962393c0329c658937d16eccaea13036412a3d1d0a5b6b8f29d738
          --admitted-receipt sha256:0275c91f056100271245d817503247bc1d8ceb27717717403030291d674c59a9
          --admitted-receipt sha256:cded0565be682398bc3c871f5666923aab04f63ace09673751c0cf243fba2917
          --admitted-receipt sha256:1c437176699f1b0f230b801e3325cd6a09a75ce4990fc257d47cc4a5247fb329
          --output outcome-assessment.json

      - name: Check nested Outcome Completion aggregation independently
        run: >-
          mirai-conformance outcome aggregate-assessment
          mirai-reference/examples/mirai-outcome-completion-minimal/aggregate-assessment.json
          --schema mirai-reference/schemas/outcome-assessment.schema.json
          --contract mirai-reference/examples/mirai-outcome-completion-minimal/outcome-contract.json
          --child-bundle mirai-reference/examples/mirai-outcome-completion-minimal/child-bundle.json
          --child-bundle mirai-reference/examples/mirai-outcome-completion-minimal/incomplete-child-bundle.json
          --admission-policy-digest sha256:17ad92e63c962393c0329c658937d16eccaea13036412a3d1d0a5b6b8f29d738
          --admitted-receipt sha256:8b7853d0548b04443aa66628d72028560d37d9cea11cfde2f348509f877c1832
          --admitted-receipt sha256:14980ef3768f52046a5084c8d58cef769d5063a9371e72dc46ff03fb0322ca92
          --admitted-receipt sha256:b0f270c084f1d8b80ed333d96f486d2a83b68f52cf56ff86466cb5ddeca12e24
          --output outcome-aggregate-assessment.json

      - name: Upload conformance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-result-${{ matrix.os }}
          path: |
            conformance-result.json
            autonomic-*.json
            retrieval-*.json
            outcome-*.json

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checker
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
